[project]
name = "mamba2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.6",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "pytest-asyncio>=1.0.0",
    "matplotlib>=3.10.3",
    "mplfinance>=0.12.10b0",
    "metatrader5>=5.0.37; sys_platform == 'win32'",
    "pywin32>=310; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "black>=24.3",
    "ruff>=0.4",
    "ipython>=8.24",
]

[tool.setuptools.packages.find]
include = ["mamba2*"]

[tool.pytest.ini_options]
addopts = ["-m", "not integration"]
markers = [
    "integration: tests requiring an explicitly configured MT5 terminal/account",
]
