[project]
name = "mamba2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "metatrader5>=5.0.37",
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.6",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "pywin32>=310",
    "pytest-asyncio>=1.0.0",
    "matplotlib>=3.10.3",
    "mplfinance>=0.12.10b0",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "black>=24.3",
    "ruff>=0.4",
    "ipython>=8.24",
]

[tool.setuptools.packages.find]
include = ["mamba2*"]
